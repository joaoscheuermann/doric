// `secrets.backend/v1` (host, until phase 4): the credential rows `core`'s
// `secrets/v1` keeps, served by `postgres`. Rows cross in plaintext; the
// encryption stays in the backend. Errors: `credential_storage_unavailable`
// (`Put` of a secret without `DORIC_CREDENTIAL_KEY`),
// `credential_key_required` (`List` or `Get` while a stored row holds a
// secret and no key is set) and `credential_unreadable` (a stored secret the
// backend cannot decrypt). Phase 4 removes this contract for `storage.kv/v1`.
syntax = "proto3";

package doric.secrets.backend.v1;

import "buf/validate/validate.proto";
import "doric/platform/v1/options.proto";

option (doric.platform.v1.contract) = {
  id: "secrets.backend/v1"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_HOST
};

// The credential rows.
service BackendService {
  // One row by id, or none.
  rpc Get(GetRequest) returns (GetResponse);
  // Every row, ordered by name as the backend stores it.
  rpc List(ListRequest) returns (ListResponse);
  // Inserts or replaces a row by id; an update never changes `kind`.
  rpc Put(PutRequest) returns (PutResponse);
  // Removes a row by id.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// A stored credential row, in plaintext.
message StoredSecret {
  // The credential's id.
  string id = 1;
  // The credential's kind.
  string kind = 2 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // The credential's name.
  string name = 3;
  // The user name, when the kind carries it.
  optional string username = 4;
  // The email, when the kind carries it.
  optional string email = 5;
  // The secret, when the kind carries it.
  optional string secret = 6 [(doric.platform.v1.field).secret = true];
  // When the row was created (ISO-8601).
  optional string created_at = 7;
  // When the row was last written (ISO-8601).
  optional string updated_at = 8;
}

// Asks one row.
message GetRequest {
  // The credential's id.
  string id = 1;
}

// One row, or none.
message GetResponse {
  // The row; absent when none has the id.
  optional StoredSecret stored_secret = 1;
}

// Asks every row.
message ListRequest {}

// Every row.
message ListResponse {
  // The rows, ordered by name.
  repeated StoredSecret secrets = 1;
}

// Writes one row.
message PutRequest {
  // The row.
  StoredSecret stored_secret = 1 [(buf.validate.field).required = true];
}

// The row is written.
message PutResponse {}

// Removes one row.
message DeleteRequest {
  // The credential's id.
  string id = 1;
}

// What the removal did.
message DeleteResponse {
  // "deleted", or "missing" when no row has the id.
  string result = 1 [(buf.validate.field).string = {
    in: [
      "deleted",
      "missing"
    ]
  }];
}
