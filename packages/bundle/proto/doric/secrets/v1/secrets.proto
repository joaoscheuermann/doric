// `secrets/v1` (host, 1.3.0): the stored credentials and the redaction list.
// A credential is of a kind, a registered name that fixes which of
// `username`, `email` and `secret` it carries: a required field must be
// present and every field the kind does not list must be absent. The
// platform defines `API_TOKEN` (`secret`) and `USERNAME_PASSWORD`
// (`username`, `secret`); a bundle registers any other with `RegisterKind`.
//
// Errors: `credential_missing` (`Resolve`, `Update`), `credential_invalid`
// (`Create`, `Update`: the values break the kind's field set),
// `credential_name_taken` (`Create`, `Update`), `credential_kind_immutable`
// (`Update` names another kind), `credential_ambiguous` (`ResolveByKind`
// finds more than one), `unknown_kind` (`Create`, `Update`, `Resolve`,
// `ResolveByKind`) and `duplicate_credential_kind` (`RegisterKind`).
//
// 1.3.0: `view` is removed for `ListSecrets`, `Redactions` and
// `AddRedaction`; `watchRedactions` becomes a stream; a reference source is
// the service `ReferenceSourceService`.
syntax = "proto3";

package doric.secrets.v1;

import "buf/validate/validate.proto";
import "doric/platform/v1/options.proto";

option (doric.platform.v1.contract) = {
  id: "secrets/v1"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_HOST
};

// The credential store's facade.
service SecretsService {
  // One credential with its secret.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // Every stored credential, without secrets.
  rpc List(ListRequest) returns (ListResponse) {
    option (doric.platform.v1.method).expose = EXPOSE_DESKTOP;
  }
  // The kinds the call's generation sees: the built-in ones and the
  // registered ones.
  rpc Kinds(KindsRequest) returns (KindsResponse);
  // Registers a credential kind for the calling instance and answers a
  // `registrationId`; a kind another registration the call collides with
  // holds is `duplicate_credential_kind`.
  rpc RegisterKind(RegisterKindRequest) returns (RegisterKindResponse);
  // Registers the calling instance as a reference source: before a
  // credential is deleted, the provider calls its
  // `ReferenceSourceService.List`, and a credential it names makes `Delete`
  // answer "referenced". Answers a `registrationId`.
  rpc RegisterReferences(RegisterReferencesRequest) returns (RegisterReferencesResponse);
  // Removes a registration `RegisterKind` or `RegisterReferences` answered;
  // an unknown id is a no-op.
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);
  // One credential without its secret, or none.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // Stores a new credential.
  rpc Create(CreateRequest) returns (CreateResponse) {
    option (doric.platform.v1.method).expose = EXPOSE_DESKTOP;
  }
  // Changes a stored credential.
  rpc Update(UpdateRequest) returns (UpdateResponse) {
    option (doric.platform.v1.method).expose = EXPOSE_DESKTOP;
  }
  // Removes a credential unless a reference source names it.
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (doric.platform.v1.method).expose = EXPOSE_DESKTOP;
  }
  // The one credential of a kind, or none; more than one is
  // `credential_ambiguous`.
  rpc ResolveByKind(ResolveByKindRequest) returns (ResolveByKindResponse);
  // Every decrypted credential, in the provider's cache order.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // The redaction list: every non-empty stored secret, then every added one.
  rpc Redactions(RedactionsRequest) returns (RedactionsResponse);
  // Adds a secret the host wrote elsewhere to the redaction list, for as long
  // as the provider runs.
  rpc AddRedaction(AddRedactionRequest) returns (AddRedactionResponse);
  // Streams the complete redaction list: the present list first, then the
  // list after every change (a credential create, update or delete, or an
  // added redaction). `Create`, `Update` and `Delete` answer only after the
  // list they produced was sent on every open stream.
  rpc WatchRedactions(WatchRedactionsRequest) returns (stream WatchRedactionsResponse) {
    option (doric.platform.v1.method).resumable = true;
  }
}

// A bundle's source of the credential ids it references, implemented by
// each instance that calls `RegisterReferences` and called by the provider
// under its write lock.
service ReferenceSourceService {
  option (doric.platform.v1.service).role = SERVICE_ROLE_HANDLER;

  // The credential ids the source references now.
  rpc List(ReferenceSourceServiceListRequest) returns (ReferenceSourceServiceListResponse);
}

// Names a stored credential.
message CredentialRef {
  // The credential's id.
  string id = 1;
}

// A credential with its secret.
message Secret {
  // The credential's id.
  string id = 1;
  // The credential's kind.
  string kind = 2 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // The credential's name.
  string name = 3;
  // The user name, when the kind carries it.
  optional string username = 4;
  // The email, when the kind carries it.
  optional string email = 5;
  // The secret, when the kind carries it.
  optional string secret = 6 [(doric.platform.v1.field).secret = true];
}

// The public view of a credential; it never carries the secret.
message CredentialDescription {
  // The credential's id.
  string id = 1;
  // The credential's kind.
  string kind = 2 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // The credential's name.
  string name = 3;
  // The user name, when the kind carries it.
  optional string username = 4;
  // The email, when the kind carries it.
  optional string email = 5;
  // Whether a secret is stored.
  bool has_secret = 6;
}

// A credential kind as it is registered: its name, the field set it fixes,
// and a label.
message CredentialKindDefinition {
  option (buf.validate.message).cel = {
    id: "credential_kind_definition.disjoint"
    message: "A credential field cannot be both required and optional."
    expression: "!this.required.exists(field, field in this.optional)"
  };
  // The kind's name.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // The fields a credential of the kind must carry: "username", "email" or
  // "secret".
  repeated string required = 2 [(buf.validate.field).repeated.items.string = {
    in: [
      "username",
      "email",
      "secret"
    ]
  }];
  // The fields a credential of the kind may also carry.
  repeated string optional = 3 [(buf.validate.field).repeated.items.string = {
    in: [
      "username",
      "email",
      "secret"
    ]
  }];
  // The kind's label for people.
  optional string label = 4;
}

// What a credential update changes: a field set changes it, a field absent
// keeps it, and `""` sets an empty value.
message CredentialUpdate {
  // The kind; must be the stored one.
  optional string kind = 1 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // The new name.
  optional string name = 2;
  // The new user name.
  optional string username = 3;
  // The new email.
  optional string email = 4;
  // The new secret.
  optional string secret = 5 [(doric.platform.v1.field).secret = true];
}

// Asks one credential with its secret.
message ResolveRequest {
  // The credential.
  CredentialRef credential_ref = 1 [(buf.validate.field).required = true];
}

// The credential with its secret.
message ResolveResponse {
  // The credential.
  Secret secret = 1 [(buf.validate.field).required = true];
}

// Asks every stored credential.
message ListRequest {}

// Every stored credential, without secrets.
message ListResponse {
  // The credentials.
  repeated CredentialDescription credentials = 1;
}

// Asks the kinds the call sees.
message KindsRequest {}

// The kinds the call sees.
message KindsResponse {
  // The kinds, the built-in ones first.
  repeated CredentialKindDefinition kinds = 1;
}

// Registers a credential kind.
message RegisterKindRequest {
  // The kind.
  CredentialKindDefinition credential_kind_definition = 1 [(buf.validate.field).required = true];
}

// The kind's registration.
message RegisterKindResponse {
  // The id `Unregister` takes.
  string registration_id = 1;
}

// Registers a reference source.
message RegisterReferencesRequest {
  // The source's name, unique for the calling bundle; the same name again
  // from the same instance replaces the registration.
  string source = 1 [(buf.validate.field).string.min_len = 1];
}

// The source's registration.
message RegisterReferencesResponse {
  // The id `Unregister` takes.
  string registration_id = 1;
}

// Removes a registration.
message UnregisterRequest {
  // The id `RegisterKind` or `RegisterReferences` answered.
  string registration_id = 1 [(buf.validate.field).string.min_len = 1];
}

// The registration is gone.
message UnregisterResponse {}

// Asks one credential without its secret.
message DescribeRequest {
  // The credential.
  CredentialRef credential_ref = 1 [(buf.validate.field).required = true];
}

// The credential, or none.
message DescribeResponse {
  // The credential; absent when none has the id.
  optional CredentialDescription credential_description = 1;
}

// A new credential.
message CreateRequest {
  // The credential's kind.
  string kind = 1 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // The credential's name.
  string name = 2;
  // The user name, when the kind carries it.
  optional string username = 3;
  // The email, when the kind carries it.
  optional string email = 4;
  // The secret, when the kind carries it.
  optional string secret = 5 [(doric.platform.v1.field).secret = true];
}

// The stored credential.
message CreateResponse {
  // The credential, without its secret.
  CredentialDescription credential_description = 1 [(buf.validate.field).required = true];
}

// Changes a stored credential.
message UpdateRequest {
  // The credential.
  CredentialRef ref = 1 [(buf.validate.field).required = true];
  // What changes.
  CredentialUpdate update = 2 [(buf.validate.field).required = true];
}

// The changed credential.
message UpdateResponse {
  // The credential, without its secret.
  CredentialDescription credential_description = 1 [(buf.validate.field).required = true];
}

// Removes a credential.
message DeleteRequest {
  // The credential.
  CredentialRef credential_ref = 1 [(buf.validate.field).required = true];
}

// What the removal did.
message DeleteResponse {
  // "deleted", "missing" (no credential has the id) or "referenced" (a
  // reference source names it, and it is kept).
  string result = 1 [(buf.validate.field).string = {
    in: [
      "deleted",
      "missing",
      "referenced"
    ]
  }];
}

// Asks the one credential of a kind.
message ResolveByKindRequest {
  // The kind.
  string kind = 1 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // Credential ids excluded before the one-match rule.
  repeated string exclude = 2;
}

// The one credential of the kind, or none.
message ResolveByKindResponse {
  // The credential; absent when none of the kind is left.
  optional Secret secret = 1;
}

// Asks every decrypted credential.
message ListSecretsRequest {}

// Every decrypted credential.
message ListSecretsResponse {
  // The credentials, in the provider's cache order.
  repeated Secret secrets = 1;
}

// Asks the redaction list.
message RedactionsRequest {}

// The redaction list.
message RedactionsResponse {
  // Every non-empty stored secret, then every added one.
  repeated string redactions = 1 [(doric.platform.v1.field).secret = true];
}

// Adds a secret to the redaction list.
message AddRedactionRequest {
  // The secret to redact.
  string secret = 1 [
    (doric.platform.v1.field).secret = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// The secret is redacted.
message AddRedactionResponse {}

// Asks the redaction list as it changes.
message WatchRedactionsRequest {}

// The complete redaction list.
message WatchRedactionsResponse {
  // Every non-empty stored secret, then every added one.
  repeated string redactions = 1 [(doric.platform.v1.field).secret = true];
}

// Asks a reference source's credential ids.
message ReferenceSourceServiceListRequest {
  // The source's name, as `RegisterReferences` took it.
  string source = 1;
}

// The credential ids a source references now.
message ReferenceSourceServiceListResponse {
  // The ids.
  repeated string credential_ids = 1;
}
