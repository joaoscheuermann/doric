name: doric-sandbox

services:
  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: ${DORIC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DORIC_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DORIC_POSTGRES_DB}
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - 127.0.0.1:${DORIC_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    build:
      context: ../..
      dockerfile: agents/doric/.Dockerfile
      target: agent-runtime
    command: npx prisma migrate deploy --config agents/doric/prisma.config.ts
    environment:
      DORIC_DATABASE_URL: postgresql://${DORIC_POSTGRES_USER}:${DORIC_POSTGRES_PASSWORD}@postgres:5432/${DORIC_POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  firecracker:
    profiles: [firecracker]
    build:
      context: ../..
      dockerfile: agents/doric/.Dockerfile
    environment:
      DORIC_DATABASE_URL: postgresql://${DORIC_POSTGRES_USER}:${DORIC_POSTGRES_PASSWORD}@127.0.0.1:${DORIC_POSTGRES_PORT:-5432}/${DORIC_POSTGRES_DB}
      DORIC_HOST: 0.0.0.0
      DORIC_SANDBOX_PROVIDER: firecracker
      DORIC_SANDBOX_SSH: '${DORIC_SANDBOX_SSH:-true}'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    network_mode: host
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - firecracker-state:/var/lib/doric/firecracker
      - firecracker-cache:/var/cache/doric/firecracker

  docker:
    profiles: [docker]
    build:
      context: ../..
      dockerfile: agents/doric/.Dockerfile
      target: docker-runtime
    environment:
      DORIC_DATABASE_URL: postgresql://${DORIC_POSTGRES_USER}:${DORIC_POSTGRES_PASSWORD}@127.0.0.1:${DORIC_POSTGRES_PORT:-5432}/${DORIC_POSTGRES_DB}
      DORIC_HOST: 0.0.0.0
      DORIC_SANDBOX_PROVIDER: docker
      # Sandboxes run the image built from agents/doric/.sandbox.Dockerfile, which
      # ships git and gh (see "Docker deploy" in README.md). A missing local tag
      # makes the provider's image pull fail rather than falling back to the
      # plain Node image; publish the tag or set DORIC_SANDBOX_IMAGE to override.
      DORIC_SANDBOX_IMAGE: ${DORIC_SANDBOX_IMAGE:-doric-sandbox:local}
      DORIC_SANDBOX_SSH: '${DORIC_SANDBOX_SSH:-true}'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  firecracker-state:
  firecracker-cache:
