[workspace]
members = [
    "scripts/sea-spike/stub-rs",
    "packages/bundle-rs",
    "bundles/foundation/sqlite/engine",
    "bundles/foundation/sqlite/storage",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
base64 = "0.22.1"
prost = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.6"
protox = "0.10.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
