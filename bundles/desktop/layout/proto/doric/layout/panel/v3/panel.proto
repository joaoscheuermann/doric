// `layout.panel/v3` (client, 3.1.0): the Project panel beside the
// conversation. Its views are the `shell.panel` region items, drawn as the
// icon-only "Project views" tab strip; the selected item's element is
// mounted. The panel is always shown: it has no open state, and nothing about
// it is persisted. It starts with no view selected.
//
// 3.1.0: `select` is asynchronous.
syntax = "proto3";

package doric.layout.panel.v3;

import "buf/validate/validate.proto";
import "doric/platform/v1/options.proto";

option (doric.platform.v1.contract) = {
  id: "layout.panel/v3"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_CLIENT
};

// The Project panel.
service PanelService {
  // Selects the view whose `shell.panel` item id is `id`. An id no item has
  // is kept: the panel draws no view until an item with that id registers.
  // Selecting the selected view changes nothing; an empty id is
  // `invalid_input`.
  rpc Select(SelectRequest) returns (SelectResponse);
}

// Selects a view.
message SelectRequest {
  // The `shell.panel` item id of the view.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// The view is selected.
message SelectResponse {}
