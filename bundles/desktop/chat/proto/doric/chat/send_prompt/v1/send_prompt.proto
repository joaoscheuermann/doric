// `chat.send-prompt/v1` (client command, 1.1.0): the composer's send, the one
// its control makes, for the Thread whose conversation holds the focus, else
// the Thread the conversation's route names; with neither it does nothing.
// It sends the words, the stack or both, and steers a running prompt.
// Before it reads the stack it dispatches `doric:prompt-send` on the
// document and waits for what a surface hands to its `waitUntil`. The
// window's `CmdOrCtrl+Enter` on the conversation's route runs it. `chat`'s
// client part registers it with `commands/v1`; a caller runs it with
// `commands/v1.Execute`, the input below carried as its
// `google.protobuf.Any`. The contract has no service.
//
// 1.1.0: the input moves from zod to `.proto` with the same fields (none).
syntax = "proto3";

package doric.chat.send_prompt.v1;

import "doric/platform/v1/options.proto";

option (doric.platform.v1.contract) = {
  id: "chat.send-prompt/v1"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_CLIENT
};

// The command's input; it carries nothing, since the focus and the route
// name the Thread.
message SendPromptInput {
  option (doric.platform.v1.command).id = "chat.send-prompt/v1";
}
