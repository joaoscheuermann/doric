// `files.open-file/v1` (client command, 1.1.0): opens one sandbox file as a
// tab of the active owner, or selects its tab when it is open. The `files`
// bundle's client part registers it with `commands/v1`; a caller runs it
// with `commands/v1.Execute`, the input below carried as its
// `google.protobuf.Any`. The contract has no service.
//
// 1.1.0: the input is the message `OpenFileInput`.
syntax = "proto3";

package doric.files.open_file.v1;

import "doric/platform/v1/options.proto";

option (doric.platform.v1.contract) = {
  id: "files.open-file/v1"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_CLIENT
};

// The command's input: the Project and the file to open.
message OpenFileInput {
  option (doric.platform.v1.command).id = "files.open-file/v1";

  // The Project.
  string project_id = 1;
  // The file, workspace-relative, as the Files tree names it; the tab's id
  // is `file:<path>`.
  string path = 2;
}
