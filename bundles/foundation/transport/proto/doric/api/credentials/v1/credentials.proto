// `api.credentials/v1` (host, 1.0.0): the public API of the named
// credentials, which replaces the `/credentials` routes. The `transport`
// bundle provides it over `secrets/v1`. No answer ever carries a secret:
// a credential is answered as its description, which says only whether a
// secret is stored.
//
// A refusal is a gRPC status whose `google.rpc.ErrorInfo` has `domain`
// "doric" and `reason` the REST error code of today: `invalid_credential_id`
// and `invalid_credential` (`INVALID_ARGUMENT`), `credential_not_found`
// (`NOT_FOUND`), `credential_kind_immutable`, `credential_name_taken` and
// `credential_referenced` (`FAILED_PRECONDITION`), and
// `credential_storage_unavailable` (`UNAVAILABLE`). No response carries an
// error.
syntax = "proto3";

package doric.api.credentials.v1;

import "buf/validate/validate.proto";
import "doric/platform/v1/options.proto";
import "doric/secrets/v1/secrets.proto";

option (doric.platform.v1.contract) = {
  id: "api.credentials/v1"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_HOST
};

// Named credentials.
service CredentialsService {
  // Every stored credential, without secrets (`GET /credentials`).
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // Stores a credential (`POST /credentials`). The fields must be the ones a
  // registered kind fixes, or the call is `invalid_credential`.
  rpc CreateCredential(CreateCredentialRequest) returns (CreateCredentialResponse);
  // Changes a stored credential (`PATCH /credentials/:id`): a field absent
  // keeps the stored value, `""` clears it, and any other value sets it. Its
  // kind never changes.
  rpc UpdateCredential(UpdateCredentialRequest) returns (UpdateCredentialResponse);
  // Removes a credential no reference source names (`DELETE
  // /credentials/:id`); a named one is kept and the call is
  // `credential_referenced`.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
}

// Asks every stored credential.
message ListCredentialsRequest {}

// Every stored credential; today's bare array.
message ListCredentialsResponse {
  // The credentials, without secrets.
  repeated doric.secrets.v1.CredentialDescription credentials = 1;
}

// A new credential: its kind's fields and nothing else.
message CreateCredentialRequest {
  // The kind, one a registration holds.
  string kind = 1 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // The name: 1 to 128 characters once trimmed.
  string name = 2 [(buf.validate.field).string.pattern = "^\\s*\\S([\\s\\S]{0,126}\\S)?\\s*$"];
  // The user name, when the kind carries it: 1 to 128 characters once
  // trimmed.
  optional string username = 3 [(buf.validate.field).string.pattern = "^\\s*\\S([\\s\\S]{0,126}\\S)?\\s*$"];
  // The email, when the kind carries it: an email of at most 256
  // characters.
  optional string email = 4 [(buf.validate.field).string = {
    max_len: 256
    email: true
  }];
  // The secret, when the kind carries it: 1 to 512 characters, no line
  // break.
  optional string secret = 5 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 512
      pattern: "^[^\\r\\n]*$"
    },
    (doric.platform.v1.field).secret = true
  ];
}

// The stored credential.
message CreateCredentialResponse {
  // The credential, without its secret.
  doric.secrets.v1.CredentialDescription credential_description = 1 [(buf.validate.field).required = true];
}

// Changes a stored credential.
message UpdateCredentialRequest {
  // The credential, a UUID.
  string credential_id = 1 [(buf.validate.field).string.uuid = true];
  // The kind; accepted only so a change to it is refused as
  // `credential_kind_immutable`.
  optional string kind = 2 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,31}$"];
  // The new name: 1 to 128 characters once trimmed.
  optional string name = 3 [(buf.validate.field).string.pattern = "^\\s*\\S([\\s\\S]{0,126}\\S)?\\s*$"];
  // The new user name: 1 to 128 characters once trimmed; `""` clears it.
  optional string username = 4 [(buf.validate.field).string.pattern = "^$|^\\s*\\S([\\s\\S]{0,126}\\S)?\\s*$"];
  // The new email, of at most 256 characters; `""` clears it.
  optional string email = 5 [(buf.validate.field).cel = {
    id: "email.valid"
    message: "email must be empty or an email of at most 256 characters"
    expression: "this == '' || (size(this) <= 256 && this.isEmail())"
  }];
  // The new secret: at most 512 characters, no line break; `""` clears it.
  optional string secret = 6 [
    (buf.validate.field).string = {
      max_len: 512
      pattern: "^[^\\r\\n]*$"
    },
    (doric.platform.v1.field).secret = true
  ];
}

// The changed credential.
message UpdateCredentialResponse {
  // The credential, without its secret.
  doric.secrets.v1.CredentialDescription credential_description = 1 [(buf.validate.field).required = true];
}

// Removes a credential.
message DeleteCredentialRequest {
  // The credential, a UUID.
  string credential_id = 1 [(buf.validate.field).string.uuid = true];
}

// The credential is removed.
message DeleteCredentialResponse {}
