// `host-config.configuration/v1` (host, 1.3.0): the settings space that holds
// the one Doric configuration, owned by `host-config`. Its value is the message
// `ConfigurationValue`, which crosses `settings/v1` as a `google.protobuf.Any`
// and is validated against this file's rules. The rules that need the provider
// kind catalog (a kind's fields and lists), the host's time zones or the
// credential store stay with the provider, `host-config`, which refuses a
// value they reject before it is written.
//
// 1.3.0: the schema moves from zod to `.proto` with the same fields.
syntax = "proto3";

package doric.host_config.configuration.v1;

import "buf/validate/validate.proto";
import "doric/platform/v1/options.proto";
import "google/protobuf/struct.proto";

option (doric.platform.v1.contract) = {
  id: "host-config.configuration/v1"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_HOST
};

// The complete configuration exactly as the host persists it: what
// `GET /config` answers and `PUT /config` accepts. It holds no secret of its
// own; every credential is named by its id.
message ConfigurationValue {
  option (doric.platform.v1.settings).id = "host-config.configuration/v1";
  option (buf.validate.message).cel = {
    id: "configuration_value.unique_provider_ids"
    message: "Provider IDs must be unique."
    expression: "this.providers.map(p, p.id).unique()"
  };
  option (buf.validate.message).cel = {
    id: "configuration_value.known_provider"
    message: "Model references an unavailable provider."
    expression: "!has(this.models) || this.providers.exists(p, p.id == this.models.execution.provider_id)"
  };
  // The model providers the host may use; at least one.
  repeated ConfigurationProvider providers = 1 [(buf.validate.field).repeated.min_items = 1];
  // The model new executions start on.
  ConfigurationModels models = 2 [(buf.validate.field).required = true];
  // The execution limits.
  ConfigurationExecution execution = 3 [(buf.validate.field).required = true];
  // Per-tool values, keyed by tool name, then by the tool's own field keys;
  // every value is a string. Open on purpose: the loaded catalog validates a
  // tool's fields at binding time. A `secret` value is a credential id.
  google.protobuf.Struct tools = 4;
  // The stored credential that holds the Git identity, a UUID.
  optional string git_credential_id = 5 [(buf.validate.field).string.uuid = true];
  // The stored credential that holds the GitHub token, a UUID.
  optional string github_credential_id = 6 [(buf.validate.field).string.uuid = true];
  // The person the prompts speak for. Absent means no name and the host's
  // time zone.
  ConfigurationProfile profile = 7;
  // How the runtime archives Threads on its own. Absent means the defaults.
  ConfigurationThreads threads = 8;
}

// One configured provider: the kind it names, that kind's values and the
// models the kind keeps.
message ConfigurationProvider {
  option (buf.validate.message).cel = {
    id: "configuration_provider.unique_model_names"
    message: "A provider cannot list a model twice."
    expression: "this.models.map(m, m.name).unique()"
  };
  // The provider's id, unique in the configuration; 1 to 128 characters.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // A provider kind of the catalog; 1 to 128 characters.
  string kind = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // The kind's own values, by field key; a `secret` field's value is a
  // credential id.
  map<string, string> configuration = 3;
  // The models the provider lists, each name once. Empty for a kind that
  // keeps no models, and for one whose models are not named yet.
  repeated ConfigurationModel models = 4;
}

// One model a provider lists.
message ConfigurationModel {
  option (buf.validate.message).cel = {
    id: "configuration_model.default_effort_listed"
    message: "A model cannot default to an effort it does not list."
    expression: "!has(this.default_effort) || this.default_effort in this.reasonings"
  };
  // The model id an execution names; 1 to 512 characters.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  // The reasoning efforts the model accepts, each once: "none", "minimal",
  // "low", "medium", "high", "xhigh" or "max". Empty for a kind that keeps no
  // reasonings.
  repeated string reasonings = 2 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {
        in: [
          "none",
          "minimal",
          "low",
          "medium",
          "high",
          "xhigh",
          "max"
        ]
      }
    }
  }];
  // The effort the model's catalog names as its default, one of
  // `reasonings`; written by the host from that catalog.
  optional string default_effort = 3 [(buf.validate.field).string = {
    in: [
      "none",
      "minimal",
      "low",
      "medium",
      "high",
      "xhigh",
      "max"
    ]
  }];
  // Whether the model's catalog pins reasoning on; written by the host from
  // that catalog.
  optional bool mandatory = 4;
}

// The models the configuration names.
message ConfigurationModels {
  // The model new executions start on.
  ExecutionModel execution = 1 [(buf.validate.field).required = true];
}

// The provider, model and effort an execution starts on.
message ExecutionModel {
  // A provider of the configuration's `providers`; 1 to 128 characters.
  string provider_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // The model id; 1 to 512 characters.
  string model = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  // The effort the model accepts; absent when the model lists none, so no
  // reasoning block is sent.
  optional string effort = 3 [(buf.validate.field).string = {
    in: [
      "none",
      "minimal",
      "low",
      "medium",
      "high",
      "xhigh",
      "max"
    ]
  }];
}

// The execution limits.
message ConfigurationExecution {
  // The most turns one execution runs, a positive whole number.
  double max_turns = 1 [
    (buf.validate.field).double = {
      gt: 0
      lte: 9007199254740991
    },
    (buf.validate.field).cel = {
      id: "max_turns.integer"
      message: "maxTurns must be a whole number"
      expression: "this == double(int(this))"
    }
  ];
  // The most characters one tool result keeps, a positive whole number;
  // absent means 50000.
  optional double max_tool_result_chars = 2 [
    (buf.validate.field).double = {
      gt: 0
      lte: 9007199254740991
    },
    (buf.validate.field).cel = {
      id: "max_tool_result_chars.integer"
      message: "maxToolResultChars must be a whole number"
      expression: "this == double(int(this))"
    }
  ];
  // The context-compaction policy; absent means the consumer's defaults.
  ContextCompactionConfig context_compaction = 3;
}

// The context-compaction policy one execution carries: past
// `pressurePercent`, the history beyond a `tailMinMessages` tail is condensed
// into one summary of at most `summaryMaxChars` characters, keeping the
// history within `charBudget`.
message ContextCompactionConfig {
  // Whether compaction runs.
  bool enabled = 1;
  // The context pressure, in percent, that triggers compaction: 50 to 95.
  int32 pressure_percent = 2 [(buf.validate.field).int32 = {
    gte: 50
    lte: 95
  }];
  // The messages always kept, a positive whole number.
  double tail_min_messages = 3 [
    (buf.validate.field).double = {
      gt: 0
      lte: 9007199254740991
    },
    (buf.validate.field).cel = {
      id: "tail_min_messages.integer"
      message: "tailMinMessages must be a whole number"
      expression: "this == double(int(this))"
    }
  ];
  // The summary's most characters, a whole number of at least 200.
  double summary_max_chars = 4 [
    (buf.validate.field).double = {
      gte: 200
      lte: 9007199254740991
    },
    (buf.validate.field).cel = {
      id: "summary_max_chars.integer"
      message: "summaryMaxChars must be a whole number"
      expression: "this == double(int(this))"
    }
  ];
  // The history's character budget, a whole number of at least 1000.
  double char_budget = 5 [
    (buf.validate.field).double = {
      gte: 1000
      lte: 9007199254740991
    },
    (buf.validate.field).cel = {
      id: "char_budget.integer"
      message: "charBudget must be a whole number"
      expression: "this == double(int(this))"
    }
  ];
}

// The person the prompts speak for.
message ConfigurationProfile {
  // The person's name: 1 to 100 characters, trimmed, with no line break.
  // Absent means no name.
  optional string name = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    },
    (buf.validate.field).cel = {
      id: "name.one_line"
      message: "A profile name cannot contain a line break."
      expression: "!this.contains('\\n') && !this.contains('\\r')"
    }
  ];
  // An IANA time zone the host knows; absent means the host's own.
  optional string timezone = 2;
}

// Thread preferences of the host.
message ConfigurationThreads {
  // How the runtime archives Threads on its own; absent means the defaults.
  ConfigurationAutoArchive auto_archive = 1;
}

// How the runtime archives Threads on its own; each absent field takes its
// default.
message ConfigurationAutoArchive {
  // Archive an agent thread 30 s after its turn ends; absent means true.
  optional bool agent_threads = 1;
  // Archive an inactive main thread after this: "1d", "7d", "30d" or
  // "never"; absent means "7d".
  optional string main_threads_after = 2 [(buf.validate.field).string = {
    in: [
      "1d",
      "7d",
      "30d",
      "never"
    ]
  }];
}
