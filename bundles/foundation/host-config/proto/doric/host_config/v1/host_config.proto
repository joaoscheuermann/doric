// `host-config/v1` (host, 1.3.0): the one Doric configuration, served by
// `host-config`. It reads the active configuration and replaces it through
// the serialized `PUT /config` pipeline. The value is the settings message of
// `host-config.configuration/v1`; `host-config` validates a replacement
// against the provider kind catalog and the credential store, which this
// contract's rules cannot reach.
//
// 1.3.0: the schema moves from zod to `.proto` with the same fields.
syntax = "proto3";

package doric.host_config.v1;

import "buf/validate/validate.proto";
import "doric/host_config/configuration/v1/configuration.proto";
import "doric/platform/v1/options.proto";
import "google/protobuf/struct.proto";

option (doric.platform.v1.contract) = {
  id: "host-config/v1"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_HOST
};

// The Doric configuration.
service HostConfigService {
  // The active configuration, its revision and its update time.
  rpc Current(CurrentRequest) returns (CurrentResponse) {
    option (doric.platform.v1.method).expose = EXPOSE_DESKTOP;
  }
  // Replaces the configuration, serialized with every other replacement. A
  // refused value is an answer, never an error: `invalid` for a value the
  // configuration rules, a credential or a tool refuses, `rejected` for any
  // other failure, and the active configuration is then unchanged.
  rpc Replace(ReplaceRequest) returns (ReplaceResponse) {
    option (doric.platform.v1.method).expose = EXPOSE_DESKTOP;
  }
}

// The configuration with its revision: the `GET /config` body.
message DoricConfiguration {
  // The configuration.
  doric.host_config.configuration.v1.ConfigurationValue configuration = 1 [(buf.validate.field).required = true];
  // The configuration's revision, a whole number; it grows on every
  // replacement.
  double revision = 2 [(buf.validate.field).cel = {
    id: "revision.integer"
    message: "revision must be a whole number"
    expression: "this == double(int(this))"
  }];
  // When the configuration was last replaced (ISO-8601, milliseconds, UTC).
  string updated_at = 3;
}

// Reads the active configuration.
message CurrentRequest {}

// The active configuration.
message CurrentResponse {
  // The configuration with its revision and update time.
  DoricConfiguration doric_configuration = 1 [(buf.validate.field).required = true];
}

// Replaces the configuration.
message ReplaceRequest {
  // The `PUT /config` body as received, any JSON value; a value the
  // configuration schema refuses answers `invalid`.
  google.protobuf.Value input = 1 [(buf.validate.field).required = true];
}

// How a replacement ended.
message ReplaceResponse {
  // The outcome, named as today's `status`.
  oneof status {
    option (doric.platform.v1.oneof).discriminator = "status";
    option (buf.validate.oneof).required = true;
    // The replacement is active.
    ConfigReplaced replaced = 1;
    // The value, a credential it names or a tool value was refused (422
    // `invalid_config`).
    ConfigInvalid invalid = 2;
    // The replacement failed for another reason (503
    // `configuration_rejected`).
    ConfigRejected rejected = 3;
  }
}

// A replacement that is active.
message ConfigReplaced {
  // The configuration now active, with its new revision.
  DoricConfiguration config = 1 [(buf.validate.field).required = true];
}

// A refused replacement.
message ConfigInvalid {
  // Why the value was refused, for the person who wrote it.
  string message = 1;
}

// A replacement that failed for a reason other than its value.
message ConfigRejected {}
