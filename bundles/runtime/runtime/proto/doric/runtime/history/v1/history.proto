// `runtime.history/v1` (host, 1.1.0): the storage type of one part of a
// Thread's opaque executor history, owned by `runtime`. The document id is
// `<threadId>:<part>`.
//
// 1.1.0: the schema moves from zod to `.proto` with the same fields.
syntax = "proto3";

package doric.runtime.history.v1;

import "buf/validate/validate.proto";
import "doric/platform/v1/options.proto";
import "google/protobuf/struct.proto";

option (doric.platform.v1.contract) = {
  id: "runtime.history/v1"
  cardinality: CARDINALITY_ONE
  environment: ENVIRONMENT_HOST
};

// One part of a Thread's executor history, as stored.
message HistoryDocument {
  option (doric.platform.v1.storage_type) = {
    type: "runtime.history/v1"
    indexes: [
      {
        name: "byThread"
        fields: ["threadId"]
      }
    ]
  };
  // The Thread, a UUID.
  string thread_id = 1 [(buf.validate.field).string.uuid = true];
  // The Project, a UUID.
  string project_id = 2 [(buf.validate.field).string.uuid = true];
  // The format the part was written in, for example "direct.history/v1".
  string format = 3;
  // The part's name.
  string part = 4;
  // The part's value, JSON, opaque to `runtime`.
  google.protobuf.Value value = 5;
}
