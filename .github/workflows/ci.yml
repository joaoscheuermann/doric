name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: doric
          POSTGRES_PASSWORD: doric
          POSTGRES_USER: doric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doric -d doric"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Keep npm's lockfile resolution aligned with the Docker builder.
      - run: npm install --global npm@11.13.0

      - run: npm ci

      - name: Check Nx sync
        run: npx nx sync:check

      - name: Test Biome configuration and bundle boundaries
        run: npm run lint:test

      - name: Check formatting
        run: npm run format:check

      - name: Lint workspace
        run: npm run lint

      - name: Apply Doric test migrations
        env:
          DORIC_DATABASE_URL: postgresql://doric:doric@127.0.0.1:5432/doric
        run: npx nx run doric-host:migrate

      - name: Run Doric tests
        env:
          DORIC_TEST_DATABASE_URL: postgresql://doric:doric@127.0.0.1:5432/doric
        run: npx nx test doric-host

      # Gate variables left unset, so their tests skip:
      # DORIC_TEST_SANDBOX: needs the sandbox image, which CI does not build.
      # DORIC_TEST_COALESCE_SIZE: a size measurement, not a correctness test.
      # DORIC_TEST_ADAPTER_CAPTURE: records a live provider and needs a key.
      - name: Run bundle tests
        env:
          DORIC_TEST_DATABASE_URL: postgresql://doric:doric@127.0.0.1:5432/doric
        run: npx nx run-many -t test --projects=tag:type:bundle

      # The platform the bundles build on: the bundle package, the desktop
      # platform package, the platform's import map and the desktop app.
      - name: Run platform tests
        run: npx nx run-many -t test -p bundle,desktop,doric-platform,doric-app

      - name: Test the fake host's bundle staging
        run: npm run test:fake-host

      - name: Run Agent tests
        run: npx nx test agent

      # Lint is reported separately during adoption.
      - run: npx nx run-many -t build typecheck
