name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: doric
          POSTGRES_PASSWORD: doric
          POSTGRES_USER: doric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doric -d doric"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Report existing style debt until the initial cleanup is complete.
      - name: Check formatting (adoption report)
        continue-on-error: true
        run: npm run format:check

      - name: Lint workspace (adoption report)
        continue-on-error: true
        run: npm run lint

      - name: Apply Doric test migrations
        env:
          DORIC_DATABASE_URL: postgresql://doric:doric@127.0.0.1:5432/doric
        run: npx nx run doric:migrate

      - name: Run Doric tests
        env:
          DORIC_TEST_DATABASE_URL: postgresql://doric:doric@127.0.0.1:5432/doric
        run: npx nx test doric

      - name: Run Agent tests
        run: npx nx test agent

      # Lint is reported separately during adoption.
      - run: npx nx run-many -t build typecheck
